name: Build Linux

on:
  push:
    branches: [main]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libsfml-dev cmake build-essential
      - run: mkdir build && cd build && cmake .. && cmake --build . -j$(nproc)
