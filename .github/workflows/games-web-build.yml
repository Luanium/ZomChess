name: Build WebAssembly

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-wasm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup emsdk
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.59

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake ninja-build git fonts-noto fonts-dejavu

      - name: Copy fonts into assets/fonts
        run: |
          mkdir -p assets/fonts
          NOTO=$(find /usr/share/fonts -name "NotoSans-Bold.ttf" 2>/dev/null | head -1)
          [ -n "$NOTO" ] && cp "$NOTO" assets/fonts/NotoSans-Bold.ttf || true

      - name: CMake configure (emcmake)
        run: |
          mkdir -p build_web
          cd build_web
          emcmake cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: CMake build
        run: |
          cd build_web
          cmake --build . --parallel

      - name: Collect web artifacts
        run: |
          mkdir -p web_dist
          [ -f build_web/ZomChess.html ] && cp build_web/ZomChess.html web_dist/index.html || true
          [ -f build_web/ZomChess.js ] && cp build_web/ZomChess.js web_dist/ZomChess.js || true
          [ -f build_web/ZomChess.wasm ] && cp build_web/ZomChess.wasm web_dist/ZomChess.wasm || true
          [ -f build_web/ZomChess.data ] && cp build_web/ZomChess.data web_dist/ZomChess.data || true
          [ -d assets ] && cp -r assets web_dist/assets || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZomChess-WebAssembly
          path: web_dist/

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web_dist
          publish_branch: gh-pages
          force_orphan: true