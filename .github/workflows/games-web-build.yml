name: Build WebAssembly

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-wasm:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout source ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Install Emscripten SDK ───────────────────────────────────────────
      - name: Setup emsdk
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.59
          actions-cache-folder: .emsdk-cache

      # ── 3. Install build dependencies ──────────────────────────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake \
            ninja-build \
            git \
            fonts-noto \
            fonts-dejavu

      # ── 4. Prepare font assets ─────────────────────────────────────────────
      - name: Copy fonts into assets/fonts
        run: |
          mkdir -p assets/fonts
          NOTO=$(find /usr/share/fonts -name "NotoSans-Bold.ttf" 2>/dev/null | head -1)
          DEJA=$(find /usr/share/fonts -name "DejaVuSans-Bold.ttf" 2>/dev/null | head -1)
          [ -n "$NOTO" ] && cp "$NOTO" assets/fonts/NotoSans-Bold.ttf || [ -n "$DEJA" ] && cp "$DEJA" assets/fonts/NotoSans-Bold.ttf

      # ── 5. Build WebAssembly ──────────────────────────────────────────────
      - name: Build WebAssembly
        run: |
          mkdir build && cd build
          emcmake cmake ..
          make -j$(nproc)

      # ── 6. Collect web artifacts ──────────────────────────────────────────
      - name: Collect web artifacts
        run: |
          mkdir -p web_dist
          cp web_build/ZomChess.html  web_dist/index.html
          cp web_build/ZomChess.js    web_dist/ZomChess.js
          cp web_build/ZomChess.wasm  web_dist/ZomChess.wasm
          # Copy .data file nếu có (được tạo bởi --preload-file)
          [ -f web_build/ZomChess.data ] && cp web_build/ZomChess.data web_dist/ZomChess.data || true
          [ -d assets ] && cp -r assets web_dist/assets || true

      # ── 7. Upload as GitHub Artifact ──────────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZomChess-WebAssembly
          path: web_dist/
          retention-days: 30

      # ── 8. Deploy to gh-pages ─────────────────────────────────────────────
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web_dist
          publish_branch: gh-pages